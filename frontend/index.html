<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#223A5E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VouAli" />
    <title>VouAli · New York</title>
  </head>
  <body style="margin:0;background:#FBF4E9">
    <div id="root"></div>

    <!-- Splash de marca: é a PRIMEIRA coisa pintada, antes mesmo do React.
         Evita o piscar da interface enquanto o app descobre quem está logado.
         O React a remove assim que sabe o que mostrar. -->
    <div id="splash" style="position:fixed;inset:0;background:#FBF4E9;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .25s ease">
      <div style="display:flex;align-items:flex-end;gap:5px;font-family:'Baloo 2','Manrope',system-ui,sans-serif;font-weight:800;font-size:34px;line-height:.9">
        <span style="color:#223A5E">Vou</span><span style="color:#F28C28">Ali</span>
        <span style="width:13px;height:13px;margin-bottom:7px;background:#F28C28;clip-path:polygon(0% 0%,100% 50%,0% 100%,22% 50%);display:block"></span>
      </div>
    </div>
    <script>
      // Rede de segurança: se o app não carregar (rede muito ruim, erro de JS),
      // a splash sai sozinha em vez de deixar a tela travada.
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s) { s.style.opacity = "0"; setTimeout(function () { s.remove(); }, 300); }
      }, 8000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // O service worker guarda os assets em cache — ótimo no SITE, em produção,
      // onde os nomes têm hash. Em desenvolvimento os arquivos mantêm o mesmo
      // endereço e ele serviria código velho, então não entra.
      //
      // No APP INSTALADO ele também não entra, e por um motivo mais forte: os
      // arquivos já estão no aparelho, dentro do APK, servidos localmente. O
      // service worker não acrescenta nada ali — só uma camada capaz de devolver
      // a coisa errada. Foi o que aconteceu: sem rede, ele respondia o
      // index.html no lugar de um `.js`, o import do Firebase morria com
      // "Unexpected token '<'" e o app ficava preso na tela de abertura, com a
      // viagem guardada a um passo de distância.
      const noApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

      if (import.meta.env.PROD && !noApp && "serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }

      // Quem já instalou o app com a versão anterior tem o service worker ativo
      // no aparelho. Sair de cena é com ele mesmo.
      if (noApp && "serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((rs) => rs.forEach((r) => r.unregister()))
          .catch(() => {});
        if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
      }
    </script>
  </body>
</html>
